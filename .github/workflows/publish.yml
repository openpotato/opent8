name: publish 
on:
  push:
    branches: 
      - main
  workflow_dispatch:  
env:
  SCHEMA_VERSION: v0.8
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    name: Build and publish Zensical website
    if: github.event.repository.fork == false    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install dependencies
        run: pip install zensical "jsonschema[format]"
      - name: Validate samples files
        shell: bash
        run: | 
          failed=0
          while IFS= read -r -d '' file; do
            python ../scripts/validate_json.py "$file" "../schemas/${SCHEMA_VERSION}/schema.json" || failed=1
          done < <(find ../samples -type f -name '*.json' -print0)
          exit "$failed"
        working-directory: samples
      - name: Build website
        run: zensical build --clean
        working-directory: website
      - name: Upload website as artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/site
      - name: Deploy website to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
